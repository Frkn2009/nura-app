# flutter_native_splash paketini pubspec.yaml'a ekleyip
# `dart run flutter_native_splash:create` çalıştır.
#
# Bu dosya splash screen ayarlarını tanımlar.

flutter_native_splash:
  color: "#58CC02"
  image: assets/icon_source.png
  android: true
  ios: true
  web: true

  android_12:
    color: "#58CC02"
    image: assets/icon_source.png

  color_dark: "#0F3D32"
  image_dark: assets/icon_source.png
