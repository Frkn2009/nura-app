name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          grep -v '^\s*$' analyze.log | sed 's/^/::error::/'
          exit 1
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: '*.log'
