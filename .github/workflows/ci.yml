name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
  workflow_dispatch:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.log
      - name: Test summary
        if: always()
        run: |
          if [ -f test-output.log ]; then
            echo "### Test çıktısı" >> $GITHUB_STEP_SUMMARY
            tail -100 test-output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "### test-output.log oluşmadı" >> $GITHUB_STEP_SUMMARY
          fi
                - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-output.log
