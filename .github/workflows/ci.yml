name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          sed 's/^/::error::/' analyze.log
          exit 1
      - run: flutter test
