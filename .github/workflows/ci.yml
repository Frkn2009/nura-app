name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          sed 's/^/::error::/' test.log
          exit ${PIPESTATUS[0]}
