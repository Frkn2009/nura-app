name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.log
      - name: Summary
        if: always()
        run: |
          echo "### ANALYZE" >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/analyze.log >> $GITHUB_STEP_SUMMARY || true
          echo "### TEST" >> $GITHUB_STEP_SUMMARY
          tail -150 /tmp/test.log >> $GITHUB_STEP_SUMMARY || true
