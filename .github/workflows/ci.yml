name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          FAIL=$?
          grep -E '\[E\]|Expected:|Actual:|Some tests failed|tests passed|✗|failed' test.log | sed 's/^/::error::/' | head -25
          echo '### Test log tail' >> $GITHUB_STEP_SUMMARY
          tail -80 test.log >> $GITHUB_STEP_SUMMARY
          exit $FAIL
