name: ci
on:
  push:
    branches: [arena/01a0275f-nura-app]
  workflow_dispatch:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.log
